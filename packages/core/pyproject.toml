[project]
name = "clinica-core"
version = "0.1.0"
description = "Código compartilhado da recepcionista de voz"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-settings>=2.16.2",
]

[project.optional-dependencies]
db = ["asyncpg", "pgvector", "sqlalchemy[asyncio]"]
embeddings = ["google-genai"]
rabbit = ["aio-pika"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

