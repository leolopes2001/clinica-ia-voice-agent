name: clinica-voz

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinica}
      POSTGRES_DB: ${POSTGRES_DB:-clinica}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management
    # O nome do nó define o diretório de dados; sem hostname fixo eles se perdem ao recriar.
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-clinica}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-clinica}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    entrypoint: ["sh", "/backup/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-clinica}
      PGPASSWORD: ${POSTGRES_PASSWORD:-clinica}
      PGDATABASE: ${POSTGRES_DB:-clinica}
      TZ: America/Sao_Paulo
      BACKUP_HORA: ${BACKUP_HORA:-03:30}
      BACKUP_RETENCAO_DIAS: ${BACKUP_RETENCAO_DIAS:-14}
      # Vazia: sem cópia externa, porque o backup nunca sai da máquina sem criptografia.
      BACKUP_SENHA: ${BACKUP_SENHA:-}
    volumes:
      - ./infra/backup:/backup:ro
      - backups:/backups
      - conhecimento_arquivos:/conhecimento:ro
      # Aponte para um disco externo ou uma pasta sincronizada.
      - ${BACKUP_DESTINO_EXTERNO:-./dados/backups-externos}:/externo
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Saudável só com um backup de até 26 h: cobre um dia inteiro e a folga de uma nova tentativa.
      test: ["CMD-SHELL", "find /backups/ultimo.json -mmin -1560 | grep -q . && grep -q '\"situacao\":\"ok\"' /backups/ultimo.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-clinica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinica}
      POSTGRES_DB: ${POSTGRES_DB:-clinica}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-clinica}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-clinica}
      AGENDA_ANTECEDENCIA_MINIMA_MIN: ${AGENDA_ANTECEDENCIA_MINIMA_MIN:-120}
      AGENDA_DURACAO_HOLD_MIN: ${AGENDA_DURACAO_HOLD_MIN:-3}
      # O agente diz este prazo ao pedir o consentimento.
      RETENCAO_TRANSCRICAO_DIAS: ${RETENCAO_TRANSCRICAO_DIAS:-90}
      # A migration cria o usuário das sessões do ADK com esta senha.
      ADK_SESSOES_SENHA: ${ADK_SESSOES_SENHA:-adk_sessoes}
      API_TOKEN_PAINEL: ${API_TOKEN_PAINEL:-token-do-painel-de-desenvolvimento}
      API_TOKEN_SERVICOS: ${API_TOKEN_SERVICOS:-token-dos-servicos-de-desenvolvimento}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  painel:
    build:
      context: .
      dockerfile: services/painel/Dockerfile
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-clinica}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-clinica}
      PAINEL_API_URL: http://api:8000
      PAINEL_MCP_CLINICA_URL: http://mcp-clinica:8000
      PAINEL_MCP_CONHECIMENTO_URL: http://mcp-conhecimento:8000
      PAINEL_LIVEKIT_URL: http://livekit:7880
      # O agente fica na rede do contêiner do LiveKit.
      PAINEL_AGENTE_URL: http://livekit:8081
      PAINEL_RABBIT_GERENCIA_URL: http://rabbitmq:15672
      PAINEL_BACKUPS_DIR: /backups
      PAINEL_SEGREDO_SESSAO: ${PAINEL_SEGREDO_SESSAO:-segredo-de-sessao-de-desenvolvimento-troque}
      # Sem HTTPS, o navegador só devolve o cookie seguro em localhost.
      PAINEL_COOKIE_SEGURO: ${PAINEL_COOKIE_SEGURO:-true}
      PAINEL_CONHECIMENTO_DIR: /dados/conhecimento
      API_TOKEN_PAINEL: ${API_TOKEN_PAINEL:-token-do-painel-de-desenvolvimento}
    ports:
      # Só na própria máquina. Para a recepção acessar pela rede, veja o runbook.
      - "${PAINEL_BIND:-127.0.0.1}:${PAINEL_PORTA:-8080}:8080"
    volumes:
      - conhecimento_arquivos:/dados/conhecimento
      # Só para ler o estado do último backup: os dumps têm permissão só para o dono.
      - backups:/backups:ro
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8080/saude')
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-clinica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinica}
      POSTGRES_DB: ${POSTGRES_DB:-clinica}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-clinica}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-clinica}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      EMBEDDING_MODELO: ${EMBEDDING_MODELO:-gemini-embedding-001}
      CONHECIMENTO_DIR: /dados/conhecimento
      RETENCAO_TRANSCRICAO_DIAS: ${RETENCAO_TRANSCRICAO_DIAS:-90}
    volumes:
      - conhecimento_arquivos:/dados/conhecimento
    depends_on:
      # As tabelas vêm das migrations, aplicadas pela API ao subir.
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "clinica_worker.saude"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  mcp-clinica:
    build:
      context: .
      dockerfile: services/mcp_clinica/Dockerfile
    restart: unless-stopped
    environment:
      MCP_CLINICA_API_URL: http://api:8000
      API_TOKEN_SERVICOS: ${API_TOKEN_SERVICOS:-token-dos-servicos-de-desenvolvimento}
    # Sem portas no host: o MCP fica só na rede interna do Docker.
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  mcp-conhecimento:
    build:
      context: .
      dockerfile: services/mcp_conhecimento/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-clinica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinica}
      POSTGRES_DB: ${POSTGRES_DB:-clinica}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      EMBEDDING_MODELO: ${EMBEDDING_MODELO:-gemini-embedding-001}
      # A tela "testar pergunta" do painel.
      API_TOKEN_PAINEL: ${API_TOKEN_PAINEL:-token-do-painel-de-desenvolvimento}
    # Sem portas no host: o MCP fica só na rede interna do Docker.
    depends_on:
      # As tabelas vêm das migrations, aplicadas pela API ao subir.
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${LIVEKIT_NODE_IP:-127.0.0.1}"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-clinica-dev}: ${LIVEKIT_API_SECRET:-segredo-de-desenvolvimento-troque-antes-de-usar}"
    volumes:
      - ./infra/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      # Só na própria máquina: o gateway da Fase 4 fala com o livekit-sip, não com estas portas.
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:7880/"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    restart: unless-stopped
    # O LiveKit anuncia a mídia em 127.0.0.1, para o navegador. Na rede dele, o agente também alcança.
    network_mode: service:livekit
    volumes:
      # Sem o arquivo da frase de espera, o agente atende sem ela.
      - ./infra/audio:/audio:ro
    environment: &ambiente-agente
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-clinica-dev}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-segredo-de-desenvolvimento-troque-antes-de-usar}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      AGENTE_MODELO_VOZ: ${AGENTE_MODELO_VOZ:-gemini-3.1-flash-live-preview}
      AGENTE_API_URL: http://api:8000
      API_TOKEN_SERVICOS: ${API_TOKEN_SERVICOS:-token-dos-servicos-de-desenvolvimento}
      AGENTE_SILENCIO_FIM_DE_FALA_MS: ${AGENTE_SILENCIO_FIM_DE_FALA_MS:-}
      AGENTE_FRASE_ESPERA_ARQUIVO: /audio/frase_espera.wav
      ADK_SESSOES_HOST: postgres
      ADK_SESSOES_DB: ${POSTGRES_DB:-clinica}
      ADK_SESSOES_SENHA: ${ADK_SESSOES_SENHA:-adk_sessoes}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-clinica}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-clinica}
      AGENTE_MCP_CLINICA_URL: http://mcp-clinica:8000/mcp
      AGENTE_MCP_CONHECIMENTO_URL: http://mcp-conhecimento:8000/mcp
      # Só o teste pelo navegador usa. Na ligação real, o telefone vem do SIP (T4.6).
      AGENTE_PERMITIR_TELEFONE_DE_TESTE: ${AGENTE_PERMITIR_TELEFONE_DE_TESTE:-true}
    depends_on:
      livekit:
        condition: service_healthy
        # Recriar o LiveKit troca a rede: o agente precisa reiniciar junto.
        restart: true
      mcp-clinica:
        condition: service_healthy
      mcp-conhecimento:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8081/')
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Página de teste por voz, só com `--profile teste`. Nunca sobe na clínica.
  teste-navegador:
    profiles: ["teste"]
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    command: ["python", "-m", "clinica_agent.navegador"]
    environment:
      <<: *ambiente-agente
      LIVEKIT_URL: ws://livekit:7880
      # O endereço que o navegador usa, diferente do da rede interna do Docker.
      LIVEKIT_URL_NAVEGADOR: ws://localhost:7880
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8090/')
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      agent:
        condition: service_healthy

volumes:
  backups:
  postgres_data:
  rabbitmq_data:
  conhecimento_arquivos:
