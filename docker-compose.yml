name: clinica-voz

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinica}
      POSTGRES_DB: ${POSTGRES_DB:-clinica}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management
    # O nome do nó define o diretório de dados; sem hostname fixo eles se perdem ao recriar.
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-clinica}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-clinica}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-clinica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinica}
      POSTGRES_DB: ${POSTGRES_DB:-clinica}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-clinica}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-clinica}
      AGENDA_ANTECEDENCIA_MINIMA_MIN: ${AGENDA_ANTECEDENCIA_MINIMA_MIN:-120}
      AGENDA_DURACAO_HOLD_MIN: ${AGENDA_DURACAO_HOLD_MIN:-3}
    ports:
      # Até a T5.1 a API confia nos headers sem autenticar: só na própria máquina.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-clinica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinica}
      POSTGRES_DB: ${POSTGRES_DB:-clinica}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-clinica}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-clinica}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      EMBEDDING_MODELO: ${EMBEDDING_MODELO:-gemini-embedding-001}
      CONHECIMENTO_DIR: /dados/conhecimento
    volumes:
      - conhecimento_arquivos:/dados/conhecimento
    depends_on:
      # As tabelas vêm das migrations, aplicadas pela API ao subir.
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "clinica_worker.saude"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  mcp-clinica:
    build:
      context: .
      dockerfile: services/mcp_clinica/Dockerfile
    restart: unless-stopped
    environment:
      MCP_CLINICA_API_URL: http://api:8000
    # Sem portas no host: o MCP fica só na rede interna do Docker.
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  mcp-conhecimento:
    build:
      context: .
      dockerfile: services/mcp_conhecimento/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-clinica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinica}
      POSTGRES_DB: ${POSTGRES_DB:-clinica}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      EMBEDDING_MODELO: ${EMBEDDING_MODELO:-gemini-embedding-001}
    # Sem portas no host: o MCP fica só na rede interna do Docker.
    depends_on:
      # As tabelas vêm das migrations, aplicadas pela API ao subir.
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres_data:
  rabbitmq_data:
  conhecimento_arquivos:
