{% extends "base.html" %}
{% block titulo %}Minha senha{% endblock %}
{% block conteudo %}
<section class="cartao estreito">
  <h1>Trocar minha senha</h1>
  {% if erro %}<p class="erro" role="alert">{{ erro }}</p>{% endif %}
  {% if aviso %}<p class="aviso" role="status">{{ aviso }}</p>{% endif %}
  <form method="post" action="/minha-senha">
    <label>Senha atual <input type="password" name="atual" autocomplete="current-password" required></label>
    <label>Nova senha <input type="password" name="nova" minlength="10" autocomplete="new-password" required></label>
    <button>Trocar a senha</button>
  </form>
</section>
{% endblock %}
